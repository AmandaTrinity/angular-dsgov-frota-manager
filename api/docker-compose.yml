services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: frota
      POSTGRES_PASSWORD: frota
      POSTGRES_DB: frota_gerencial
    ports:
      - '5433:5432'
    volumes:
      - frota_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U frota -d frota_gerencial']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  frota_postgres_data:
